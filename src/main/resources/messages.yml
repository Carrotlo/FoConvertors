tokens:
  prefix: "{theme}FoConvertors{muted} » "
  theme: "#03fc88"
  muted: "#a7b8b0"
  success: "#59d65f"
  good: "#3ecf8e"
  bad: "#ff5a5a"
  white: "#ffffff"

native-dialogs-fallback: "{prefix}{muted}Native dialogs are not supported on this server, using chat input."

command:
  no-permission: "{prefix}{bad}You do not have permission for this command."
  player-only: "{prefix}{bad}This command can only be used by players."
  unknown-subcommand: "{prefix}{bad}Unknown subcommand: {theme}{sub}"
  usage-give: "{prefix}{muted}Usage: {theme}/foconvertors give {player} {convertorId} [amount]"
  player-not-found: "{prefix}{bad}Player not found: {theme}{player}"
  convertor-not-found: "{prefix}{bad}Convertor not found: {theme}{id}"
  invalid-amount: "{prefix}{bad}Amount must be a valid number."
  gave: "{prefix}{success}Gave {theme}{amount}x {success}convertor {theme}{id} {success}to {theme}{player}{success}."
  received: "{prefix}{success}You received {theme}{amount}x {success}convertor {theme}{id}{success}."
  reloaded: "{prefix}{success}Config, messages, and convertor templates reloaded."
  reload-failed: "{prefix}{bad}Reload failed at {theme}{step}{bad}. {muted}{error}"
  help-header: "{prefix}{muted}Available commands:"
  help-version: "{muted}- {theme}/foconvertors version"
  help-editor: "{muted}- {theme}/foconvertors editor"
  help-give: "{muted}- {theme}/foconvertors give {player} {id} [amount]"
  help-reload: "{muted}- {theme}/foconvertors reload"

toggle:
  enabled: "{prefix}{success}Convertor {theme}{id} {success}enabled."
  disabled: "{prefix}{bad}Convertor {theme}{id} {bad}disabled."
  cooldown: "{prefix}{muted}Please wait {theme}{remaining}ms {muted}before toggling again."

convertor-item:
  status-enabled: "{white}Status: {success}Enabled"
  status-disabled: "{white}Status: {bad}Disabled"
  toggle: "{white}Toggle: {theme}{mode} {white}while holding."

editor:
  not-found: "{prefix}{bad}Convertor template not found: {theme}{id}"
  enter-id: "{prefix}{muted}Type the new convertor id in chat ({theme}a-z, 0-9, _, -{muted}) or type {theme}cancel{muted}."
  invalid-id: "{prefix}{bad}Invalid id. Use 3-32 chars: a-z, 0-9, _, -"
  already-exists: "{prefix}{bad}Convertor {theme}{id} {bad}already exists."
  created: "{prefix}{success}Created convertor template {theme}{id}{success}."
  deleted: "{prefix}{success}Deleted convertor template {theme}{id}{success}."
  create-cancelled: "{prefix}{muted}Convertor creation cancelled."
  recipe-not-found: "{prefix}{bad}Recipe not found: {theme}{recipe}"
  recipe-created: "{prefix}{success}Created recipe {theme}{recipe}{success}."
  recipe-deleted: "{prefix}{success}Deleted recipe {theme}{recipe}{success}."
  recipe-delete-last: "{prefix}{bad}A convertor must have at least one recipe."
  enter-input-amount: "{prefix}{muted}Type the new {theme}input amount {muted}for recipe {theme}{recipe}{muted} (current: {theme}{current}{muted}) or type {theme}cancel{muted}."
  enter-output-amount: "{prefix}{muted}Type the new {theme}output amount {muted}for recipe {theme}{recipe}{muted} (current: {theme}{current}{muted}) or type {theme}cancel{muted}."
  amount-invalid: "{prefix}{bad}Invalid amount. Enter a number from {theme}1 {bad}to {theme}6400{bad}."
  amount-cancelled: "{prefix}{muted}Amount edit cancelled."
  input-amount-set: "{prefix}{success}Input amount for {theme}{recipe} {success}updated to {theme}{amount}{success}."
  output-amount-set: "{prefix}{success}Output amount for {theme}{recipe} {success}updated to {theme}{amount}{success}."
  cursor-required: "{prefix}{bad}Put an item on your cursor first, then click the slot again."
  input-set: "{prefix}{success}Updated input item for {theme}{recipe}{success}."
  output-set: "{prefix}{success}Updated output item for {theme}{recipe}{success}."
  display-set: "{prefix}{success}Updated display item for {theme}{id}{success}."
